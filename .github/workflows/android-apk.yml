# Rebuild trigger: fresh APK build; preserve app identity and signing configuration.
name: Android APK build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [feature/supabase-shared-clinic, fix/persistent-cloud-account]
    paths:
      - 'index.html'
      - 'supabase/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Verify cloud sync modules are packaged
        run: test -f www/supabase/cloud-portal.js && test -f www/supabase/auth-adapter.js && test -f www/supabase/patient-sync-service.js
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Configure GitHub OAuth deep link
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(path, 'utf8');
          if (!xml.includes('com.dentalclinic.os')) {
            const main = xml.indexOf('MainActivity');
            const start = xml.lastIndexOf('<activity', main);
            const close = xml.indexOf('</activity>', main);
            if (main < 0 || start < 0 || close < 0) throw new Error('MainActivity manifest entry not found');
            const filter = [
              '            <intent-filter>',
              '                <action android:name="android.intent.action.VIEW" />',
              '                <category android:name="android.intent.category.DEFAULT" />',
              '                <category android:name="android.intent.category.BROWSABLE" />',
              '                <data android:scheme="com.dentalclinic.os" android:host="auth-callback" />',
              '            </intent-filter>',
              ''
            ].join('\n');
            xml = xml.slice(0, close) + filter + xml.slice(close);
            fs.writeFileSync(path, xml);
          }
          NODE
      - name: Set upgrade version code
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let gradle = fs.readFileSync(path, 'utf8');
          const code = 1000 + Number(process.env.ANDROID_VERSION_CODE || 1);
          if (!/versionCode\s+\d+/.test(gradle)) throw new Error('Could not find Android versionCode');
          gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + code);
          gradle = gradle.replace(/versionName\s+"[^"]*"/, 'versionName "1.0.' + process.env.ANDROID_VERSION_CODE + '"');
          fs.writeFileSync(path, gradle);
          console.log('Android versionCode=' + code);
          NODE
      - name: Restore persistent debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret before building an installable update."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Configure explicit debug signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Verify APK signing certificate
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -p "$APK" META-INF/CERT.RSA > /tmp/apk-cert.rsa
          ACTUAL=$(keytool -printcert -file /tmp/apk-cert.rsa | awk '/SHA256:/{print $2}' | tr -d ':')
          EXPECTED=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA256:/{print $2}' | tr -d ':')
          echo "APK signer SHA-256: $ACTUAL"
          echo "Keystore SHA-256:   $EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dental-clinic-os-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
