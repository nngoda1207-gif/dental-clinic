name: Build Dental Clinic APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Validate JavaScript modules and app script
        run: |
          set -e
          for file in supabase/*.js; do
            node --input-type=module --check < "$file"
          done
          for file in scripts/*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/dcos-index-inline.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/dcos-index-inline.js

      - name: Build web assets (including Supabase modules)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Initialize Capacitor Android
        run: |
          npx cap init "Dental Clinic OS" "com.dentalclinic.os" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fix Kotlin dependencies
        run: |
          cat >> android/build.gradle <<'EOF'

          subprojects {
              configurations.configureEach {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dental-clinic-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
