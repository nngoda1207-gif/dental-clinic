name: Supabase schema smoke tests

on:
  push:
    branches: [feature/supabase-shared-clinic]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-schema-test.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-schema-test.yml'
  workflow_dispatch:

jobs:
  postgres-migrations-and-smoke-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: clinic_test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Supabase ES module syntax
        run: |
          node --input-type=module --check < supabase/auth-adapter.js
          node --input-type=module --check < supabase/cloud-portal.js
          node --input-type=module --check < supabase/patient-repository.js
          node --input-type=module --check < supabase/patient-validation.js
          node --input-type=module --check < supabase/import-preview.js
          node --input-type=module --check < supabase/clinic-context.js
          node --input-type=module --check < supabase/patient-sync-service.js
          node --input-type=module --check < supabase/appointment-mapping.js
          node --input-type=module --check < supabase/appointment-repository.js
          node --input-type=module --check < supabase/appointment-sync-service.js
          node --input-type=module --check < supabase/patient-import-service.js
          node supabase/tests/realtime-publication.test.mjs
          node supabase/tests/patient-local-identity.test.mjs
          node --input-type=module --check < supabase/appointment-repository.js
          node --input-type=module --check < supabase/appointment-sync-service.js
          node --input-type=module --check < supabase/appointment-mapping.js
          node --input-type=module --check < supabase/inventory-repository.js
          node --input-type=module --check < supabase/inventory-sync-service.js
          node --input-type=module --check < supabase/clinical-record-repository.js
          node --input-type=module --check < supabase/clinical-record-sync-service.js
          node --input-type=module --check < supabase/clinical-details-repository.js
          node --input-type=module --check < supabase/clinical-details-sync-service.js
          node --input-type=module --check < supabase/prescription-consent-repository.js
          node --input-type=module --check < supabase/prescription-consent-sync-service.js
          node --input-type=module --check < supabase/financial-repository.js
          node --input-type=module --check < supabase/financial-sync-service.js
          node --input-type=module --check < supabase/treatment-repository.js
          node --input-type=module --check < supabase/treatment-sync-service.js
          node supabase/tests/invoice-items.test.mjs
          node supabase/tests/patient-validation.test.mjs
          node supabase/tests/patient-repository.test.mjs
          node supabase/tests/import-preview.test.mjs
          node supabase/tests/patient-import-service.test.mjs
          node supabase/tests/clinic-context.test.mjs
          node supabase/tests/patient-sync-service.test.mjs
          node supabase/tests/appointment-sync-service.test.mjs
          node supabase/tests/appointment-mapping.test.mjs
          node supabase/tests/inventory-sync-service.test.mjs
          node supabase/tests/clinical-record-sync-service.test.mjs
          node supabase/tests/clinical-details-sync-service.test.mjs
          node supabase/tests/prescription-consent-sync-service.test.mjs
          node supabase/tests/financial-sync-service.test.mjs
          node supabase/tests/treatment-sync-service.test.mjs
          node supabase/tests/cloud-portal.test.mjs
          node supabase/tests/appointment-mapping.test.mjs
          node supabase/tests/appointment-repository.test.mjs
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap minimal Supabase Auth compatibility
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply migration 001
        run: psql -v ON_ERROR_STOP=1 -f supabase/001_clinic_membership.sql
      - name: Apply migration 002
        run: psql -v ON_ERROR_STOP=1 -f supabase/002_operational_tables.sql
      - name: Apply migration 003
        run: psql -v ON_ERROR_STOP=1 -f supabase/003_supplemental_clinical_tables.sql
      - name: Apply migration 004
        run: psql -v ON_ERROR_STOP=1 -f supabase/004_integrity_guards.sql
      - name: Apply migration 005
        run: psql -v ON_ERROR_STOP=1 -f supabase/005_ledger_and_parent_guards.sql
      - name: Apply migration 006
        run: psql -v ON_ERROR_STOP=1 -f supabase/006_atomic_inventory_posting.sql
      - name: Grant table privileges for authenticated test role
        run: psql -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO authenticated; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO authenticated;"
      - name: Apply migration 007
        run: psql -v ON_ERROR_STOP=1 -f supabase/007_stock_privileges_and_appointment_overlap.sql
      - name: Apply migration 008
        run: psql -v ON_ERROR_STOP=1 -f supabase/008_inventory_rpc_only.sql
      - name: Apply migration 009
        run: psql -v ON_ERROR_STOP=1 -f supabase/009_patient_profile_fields.sql
      - name: Run synthetic RLS and integrity smoke tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/smoke.sql
      - name: Test patient profile migration fields and constraints
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/patient-profile-migration.test.sql
      - name: Apply migration 010
        run: psql -v ON_ERROR_STOP=1 -f supabase/010_atomic_invoice_payments.sql
      - name: Test atomic invoice payment and refund ledger
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/financial-ledger.test.sql
      - name: Apply migration 011
        run: psql -v ON_ERROR_STOP=1 -f supabase/011_invoice_items_and_service_pricing.sql
      - name: Test invoice items and service pricing
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/invoice-items.test.sql
      - name: Apply migration 012
        run: psql -v ON_ERROR_STOP=1 -f supabase/012_treatment_to_invoice.sql
      - name: Test completed treatment invoicing
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/treatment-invoice.test.sql

      - name: Apply migration 013
        run: psql -v ON_ERROR_STOP=1 -f supabase/013_patient_realtime_publication.sql

      - name: Apply migration 014
        run: psql -v ON_ERROR_STOP=1 -f supabase/014_patient_local_identity.sql

      - name: Verify patient local identity schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/patient-local-identity.test.sql

      - name: Apply migration 015
        run: psql -v ON_ERROR_STOP=1 -f supabase/015_patient_updated_at_trigger.sql
      - name: Verify patient optimistic version trigger
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/patient-updated-at-trigger.test.sql

      - name: Apply migration 016
        run: psql -v ON_ERROR_STOP=1 -f supabase/016_appointment_local_identity.sql
      - name: Verify appointment sync identity and chair guards
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/appointment-local-identity.test.sql

      - name: Apply migration 017
        run: psql -v ON_ERROR_STOP=1 -f supabase/017_inventory_idempotent_posting.sql
      - name: Verify idempotent inventory movement posting
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/inventory-idempotent-posting.test.sql

      - name: Apply migration 018
        run: psql -v ON_ERROR_STOP=1 -f supabase/018_clinical_local_identity.sql
      - name: Verify clinical local identities and versioning
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/clinical-local-identity.test.sql

      - name: Apply migration 019
        run: psql -v ON_ERROR_STOP=1 -f supabase/019_idempotent_financial_ledger.sql
      - name: Verify retry-safe payment and refund ledger
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/financial-idempotent-ledger.test.sql

      - name: Apply migration 020
        run: psql -v ON_ERROR_STOP=1 -f supabase/020_lab_sync_identity.sql
      - name: Verify retry-safe lab payments
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/lab-idempotent-payment.test.sql

      - name: Apply migration 021
        run: psql -v ON_ERROR_STOP=1 -f supabase/021_lab_payment_retry_timestamp.sql
      - name: Verify lab payment retry without explicit timestamp
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/lab-payment-retry-timestamp.test.sql

      - name: Apply migration 022 staff invitations
        run: psql -v ON_ERROR_STOP=1 -f supabase/022_staff_invitations.sql
      - name: Verify owner-issued single-use staff invitations
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/staff-invitations.test.sql
      - name: Apply migration 023 username accounts
        run: psql -v ON_ERROR_STOP=1 -f supabase/023_username_accounts.sql
      - name: Apply migration 024 private RLS helpers
        run: psql -v ON_ERROR_STOP=1 -f supabase/024_private_rls_helpers.sql
      - name: Apply migration 025 generic clinic records
        run: psql -v ON_ERROR_STOP=1 -f supabase/025_generic_clinic_records.sql
      - name: Apply migration 026 guarded appointments
        run: psql -v ON_ERROR_STOP=1 -f supabase/026_server_guarded_appointments.sql
      - name: Verify generic clinic records schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/generic-clinic-records.test.sql
      - name: Verify generic clinic records module and branch RLS
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/generic-clinic-records-rls.test.sql
      - name: Verify guarded appointment writes and overlap prevention
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/appointment-records.test.sql
      - name: Check generic cloud record modules
        run: |
          node --input-type=module --check < supabase/cloud-record-repository.js
          node --input-type=module --check < supabase/cloud-record-sync-service.js
          node --input-type=module --check < supabase/patient-repository.js
          node --input-type=module --check < supabase/cloud-portal.js
          node supabase/tests/cloud-record-sync-service.test.mjs
          node supabase/tests/cloud-staff-permissions.test.mjs
          node supabase/tests/patient-repository.test.mjs
