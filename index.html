<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dental Clinic OS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f6f5;--cd:#fff;--tx:#14262e;--mu:#5b6f77;--pr:#17324d;--ac:#1f8a80;--ac2:#dff1ee;--bd:#d8e2e0;--er:#b42318;--ok:#157347}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0d171b;--cd:#15232a;--tx:#e5eeee;--mu:#93a9b0;--pr:#9cc4e4;--ac:#3ec3b4;--ac2:#10332f;--bd:#26383f;--er:#f97066;--ok:#4ade80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d171b;--cd:#15232a;--tx:#e5eeee;--mu:#93a9b0;--pr:#9cc4e4;--ac:#3ec3b4;--ac2:#10332f;--bd:#26383f;--er:#f97066;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,"Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:10}
h2{margin:.2em 0 .6em;font-size:1.3rem;color:var(--pr)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.top b{color:var(--pr);font-size:1.05rem;margin-inline-end:auto}
.layout{display:block;max-width:1100px;margin:auto}
.nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}
.nav a{padding:6px 14px;border-radius:8px;white-space:nowrap;cursor:pointer;color:var(--mu);border:1px solid transparent}
.nav a.on{background:var(--ac2);color:var(--pr);border-color:var(--ac);font-weight:600}
main{padding:6px 14px 40px;min-width:0}
@media(min-width:900px){.layout{display:grid;grid-template-columns:190px 1fr}.nav{flex-direction:column;padding:14px 0 14px 8px}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.m{color:var(--mu);font-size:.88rem}
.auth{max-width:420px;margin:8vh auto;padding:20px}
.fl{display:block;margin:8px 0;font-size:.88rem;color:var(--mu)}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-top:3px}
.b,.g,.d{font:inherit;border-radius:8px;padding:8px 16px;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:#fff;font-weight:600}
.g{background:transparent;color:var(--pr);border-color:var(--bd)}
.d{background:transparent;color:var(--er);border-color:var(--er)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar>*{flex:1 1 150px;width:auto;margin:0}.bar>button{flex:0 0 auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:600;font-size:.85rem}
tr.k{cursor:pointer}tr.k:hover{background:var(--ac2)}
.tg{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--ac2);color:var(--pr);font-size:.78rem;margin-inline-end:4px}
.tg.x{background:transparent;border:1px solid var(--er);color:var(--er)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat b{display:block;font-size:2rem;color:var(--pr);line-height:1.2}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.kv span{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));column-gap:24px}
.tabs{display:flex;gap:6px;margin:10px 0}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);width:min(560px,94vw);max-height:90vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--pr);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:50;display:none}
.wa a{display:inline-block;margin:4px 0 0 6px;padding:5px 12px;border:1px solid var(--ok);color:var(--ok);border-radius:8px;text-decoration:none;font-size:.88rem}
.warn{border-color:#b7791f;background:rgba(183,121,31,.12)}
.tabs{flex-wrap:wrap}.ch{direction:ltr;min-width:640px}.tr{display:flex;gap:3px;margin-bottom:3px;justify-content:center}.th{flex:1 1 0;min-width:36px;padding:4px 1px;border:1px solid var(--bd);border-radius:6px;color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}.th small{font-size:.62rem}
.sec{border:1px solid var(--bd);border-radius:10px;background:var(--cd);margin-bottom:8px;padding:0 10px}.sec summary{cursor:pointer;padding:10px 0;font-weight:600;color:var(--pr)}.sec>.b{margin:8px 0 10px}.ir{display:flex;gap:6px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--bd)}.ir textarea{flex:1;min-width:0;min-height:40px;resize:none;overflow:hidden;margin:0}.iu{width:72px;flex:none;margin:0}.ip{width:92px;flex:none;margin:0}.sh{display:flex;gap:6px;align-items:flex-start}.sl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}.sq{width:84px;margin:0}.sl label{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--mu)}.sl label input{width:84px;margin:0}
.ir.kr{display:block}.ir .g{padding:6px 10px;font-size:.85rem}.ir input,.ir textarea{padding:7px 8px}.sl{row-gap:8px}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog><dialog id="dlg2"></dialog>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const h=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nd=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const nm=s=>nd(s).toLowerCase().replace(/[\u064B-\u065F]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now=()=>new Date().toISOString();
let LANG='ar';try{LANG=localStorage.getItem('dcs_lang')||'ar'}catch(e){}
const LC=()=>LANG==='en'?'en-GB':'ar-EG';
const fd=t=>t?new Date(t).toLocaleString(LC(),{dateStyle:'medium',timeStyle:'short'}):'—';
const v=id=>($('#'+id)||{value:''}).value.trim();
const age=d=>{if(!d)return'';const a=new Date(d),n=new Date();let y=n.getFullYear()-a.getFullYear();if(n<new Date(n.getFullYear(),a.getMonth(),a.getDate()))y--;return y>=0?y+' سنة':''};
let D=null,ME=null,view='dash',sel=null,tab='ov',q='',st='active',lim=25,br='all';
try{const r=localStorage.getItem('dcos1');if(r)D=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem('dcos1',JSON.stringify(D))}catch(e){toast('تعذر الحفظ في المتصفح')}}
window.addEventListener('dcos:cloud-bootstrap',event=>{
  const detail=event.detail||{};
  const branches=Array.isArray(detail.branches)?detail.branches:[];
  if(D&&Array.isArray(D.branches)&&D.branches.length)return; // never replace an existing local clinic
  if(!branches.length)return;
  const localBranches=branches.map(branch=>({
    id:String(branch.id),name:String(branch.name||'الفرع'),
    address:branch.address||'',phone:branch.phone||'',hours:branch.hours||''
  }));
  const users=(Array.isArray(detail.dentists)?detail.dentists:[]).map(staff=>{
    const role=['owner','manager','dentist'].includes(staff.role)?staff.role:'dentist';
    return {
      id:String(staff.user_id),name:String(staff.username||staff.user_id),
      user:String(staff.username||'').toLowerCase(),role,
      branches:(staff.branch_ids||[]).map(String).filter(id=>localBranches.some(branch=>branch.id===id)),
      permissions:[],active:true,cloud:true
    };
  });
  D={
    v:1,seq:0,
    settings:{clinic:String(detail.clinicName||'عيادة الأسنان'),ph:''},
    branches:localBranches,users,patients:[],audit:[]
  };
  save();
  view='dash';sel=null;br='all';
  render();
  toast('تم تحميل بيانات العيادة والفروع من السحابة. سجّل الدخول بحسابك.');
});


const CLOUD_PATIENT_FIELDS=['name','en','gov','so','tg','ph','ph2','em','dob','g','ad','ec','st'];
function cloudPatientSnapshot(p){const x={};for(const k of CLOUD_PATIENT_FIELDS)x[k]=k==='tg'?(Array.isArray(p?.[k])?p[k]:[]):(p?.[k]??'');return x}
function sameCloudSnapshot(a,b){return JSON.stringify(cloudPatientSnapshot(a))===JSON.stringify(cloudPatientSnapshot(b))}
function applyCloudPatientFields(local,remote){const s=cloudPatientSnapshot(remote);Object.assign(local,s)}
function localPatientSyncPayload(p){return {id:p.id,remoteId:p.remoteId||'',cloudUpdatedAt:p.cloudUpdatedAt||'',localBranchId:p.br,no:p.no,...cloudPatientSnapshot(p)}}
window.addEventListener('dcos:patient-sync-conflict',event=>{
  if(!D||!ME)return;
  const {localId,localBranchId,reason}=event.detail||{};
  const local=D.patients.find(p=>String(p.id)===String(localId)&&p.br===localBranchId);
  if(!local)return;
  local.cloudConflict=reason||'sync_conflict';save();
  if(view==='pat'&&sel===local.id&&!$('#dlg')?.open&&!$('#dlg2')?.open)render();
});
window.addEventListener('dcos:cloud-patient-links',event=>{
  if(!D||!ME)return;
  let changed=false;
  for(const link of event.detail?.links||[]){
    const local=D.patients.find(p=>String(p.id)===String(link.localId)&&p.br===link.localBranchId);
    if(!local)continue;
    local.remoteId=link.remoteId;local.remoteBranchId=link.remoteBranchId;local.cloudUpdatedAt=link.remoteUpdatedAt||'';
    local.cloudSnapshot=cloudPatientSnapshot(local);local.cloudConflict='';
    changed=true;
  }
  if(changed){save();if(!$('#dlg')?.open&&!$('#dlg2')?.open)render()}
});
window.addEventListener('dcos:cloud-patients',event=>{
  if(!D||!ME)return;
  const {localBranchId,patients=[]}=event.detail||{};
  if(!localBranchId||!myBr().some(b=>b.id===localBranchId))return;
  let changed=false,conflicts=0;
  for(const remote of patients){
    const incoming=cloudPatientSnapshot(remote);
    let local=D.patients.find(p=>p.remoteId&&p.remoteId===remote.remoteId);
    if(!local)local=D.patients.find(p=>p.br===localBranchId&&String(p.no)===String(remote.no));
    if(!local){
      const added={id:uid(),no:remote.no,...incoming,br:localBranchId,created:remote.created||now(),by:'مزامنة سحابية',byr:'cloud',notes:[],remoteId:remote.remoteId,remoteBranchId:remote.br,cloudSnapshot:incoming,cloudUpdatedAt:remote.remoteUpdatedAt||''};
      D.patients.push(added);const seq=/^P-(\d+)$/.exec(String(remote.no||''));if(seq)D.seq=Math.max(Number(D.seq)||0,Number(seq[1]));changed=true;continue;
    }
    if(local.remoteId&&local.remoteId!==remote.remoteId){conflicts++;local.cloudConflict='remote_id_mismatch';continue}
    const baseline=local.cloudSnapshot||null;
    const current=cloudPatientSnapshot(local);
    if(!baseline){
      if(String(remote.sourceLocalId||'')===String(local.id)){
        local.remoteId=remote.remoteId;local.remoteBranchId=remote.br;local.cloudUpdatedAt=remote.remoteUpdatedAt||'';local.cloudSnapshot=incoming;local.cloudConflict='';
        window.dispatchEvent(new CustomEvent('dcos:patient-saved',{detail:localPatientSyncPayload(local)}));changed=true;
      }else if(sameCloudSnapshot(current,incoming)){
        local.remoteId=remote.remoteId;local.remoteBranchId=remote.br;local.cloudSnapshot=incoming;local.cloudUpdatedAt=remote.remoteUpdatedAt||'';changed=true;
      }else{local.cloudConflict='needs_manual_link';conflicts++}
      continue;
    }
    const localChanged=!sameCloudSnapshot(current,baseline);
    const remoteChanged=!sameCloudSnapshot(incoming,baseline);
    if(localChanged&&remoteChanged&&!sameCloudSnapshot(current,incoming)){
      local.cloudConflict='concurrent_edit';conflicts++;continue;
    }
    if(remoteChanged&&!localChanged){applyCloudPatientFields(local,remote);local.cloudSnapshot=incoming;changed=true}
    else if(localChanged&&!remoteChanged){
      window.dispatchEvent(new CustomEvent('dcos:patient-saved',{detail:localPatientSyncPayload(local)}));
    }else if(sameCloudSnapshot(current,incoming)){local.cloudSnapshot=incoming;local.cloudConflict='';changed=true}
    local.remoteId=remote.remoteId;local.remoteBranchId=remote.br;local.cloudUpdatedAt=remote.remoteUpdatedAt||'';
  }
  if(changed){save();if(!$('#dlg')?.open&&!$('#dlg2')?.open)render()}
  if(conflicts)toast('هناك '+conflicts+' تعارضات في بيانات المرضى؛ احتفظنا بالنسخة المحلية ولم نستبدلها.');
});
window.addEventListener('dcos:get-local-appointments',event=>{
  if(!D||!ME)return;
  const detail=event.detail||{};
  if(typeof detail.respond!=='function')return;
  const branchId=String(detail.localBranchId||'');
  detail.respond({
    appointments:(D.appts||[]).filter(item=>item.br===branchId).map(item=>({...item,cloudSnapshot:item.cloudSnapshot?{...item.cloudSnapshot}:null})),
    patients:(D.patients||[]).filter(item=>item.br===branchId).map(item=>({...item})),
    users:(D.users||[]).map(item=>({...item})),
    chairs:(D.chairs||[]).filter(item=>item.br===branchId).map(item=>({...item}))
  });
});


window.addEventListener('dcos:get-local-cloud-data',event=>{
  if(!D||!ME)return;
  const detail=event.detail||{};
  if(typeof detail.respond!=='function')return;
  const branchId=String(detail.localBranchId||'');
  const patients=(D.patients||[]).filter(patient=>patient.br===branchId).map(patient=>({
    id:patient.id,no:patient.no,cloudModules:patient.cloudModules?JSON.parse(JSON.stringify(patient.cloudModules)):{},
    mh:patient.mh||{c:[]},teeth:patient.teeth||{},plan:patient.plan||[],visits:patient.visits||[],
    rx:patient.rx||[],cons:patient.cons||[],perio:patient.perio||[],pdisc:patient.pdisc||0,
    appr:patient.appr||null,notes:patient.notes||[],pay:patient.pay||[]
  }));
  const labs=(D.labs||[]).map(lab=>({...lab}));
  const labCases=(D.lab||[]).filter(item=>item.br===branchId).map(item=>({...item,
    pays:Array.isArray(item.pays)?item.pays.map(payment=>({...payment})):[],
    hist:Array.isArray(item.hist)?item.hist.map(entry=>({...entry})):[],
    cloudSnapshot:item.cloudSnapshot?JSON.parse(JSON.stringify(item.cloudSnapshot)):null
  }));
  detail.respond({patients,labs,labCases});
});
window.addEventListener('dcos:cloud-patient-modules',event=>{
  if(!D||!ME)return;
  const {localBranchId,module,records=[],conflicts=[]}=event.detail||{};
  if(!localBranchId||!myBr().some(branch=>branch.id===localBranchId))return;
  let changed=false;
  for(const record of records){
    const patient=(D.patients||[]).find(item=>item.br===localBranchId&&String(item.no)===String(record.patientNo));
    if(!patient)continue;
    const payload=record.payload||{};
    if(module==='treatment'){
      for(const key of ['mh','teeth','plan','visits','rx','cons','perio','pdisc','appr','notes']){
        if(Object.prototype.hasOwnProperty.call(payload,key))patient[key]=payload[key];
      }
    }else if(module==='finance'){
      if(Array.isArray(payload.pay))patient.pay=payload.pay;
    }
    patient.cloudModules=patient.cloudModules||{};
    patient.cloudModules[module]={revision:record.revision,snapshot:JSON.parse(JSON.stringify(payload))};
    changed=true;
  }
  for(const conflict of conflicts){
    const patient=(D.patients||[]).find(item=>item.br===localBranchId&&String(item.no)===String(conflict.patientNo));
    if(patient){patient.cloudModuleConflicts=patient.cloudModuleConflicts||{};patient.cloudModuleConflicts[module]=conflict.reason||'sync_conflict';}
  }
  if(changed||conflicts.length){save();if(view==='pat'&&sel&&!$('#dlg')?.open&&!$('#dlg2')?.open)detV();}
  if(conflicts.length)toast('يوجد '+conflicts.length+' تعارضات في '+(module==='treatment'?'الملفات الطبية':'الحسابات')+'؛ لم يتم استبدال البيانات المتعارضة.');
});

window.addEventListener('dcos:get-local-inventory',event=>{
  if(!D||!ME)return;
  const detail=event.detail||{};
  if(typeof detail.respond!=='function')return;
  const branchId=String(detail.localBranchId||'');
  detail.respond({items:(D.items||[]).filter(item=>item.br===branchId).map(item=>({...item,mv:Array.isArray(item.mv)?item.mv.map(m=>({...m})):[]}))});
});
window.addEventListener('dcos:cloud-labs',event=>{
  if(!D||!ME)return;
  const {localBranchId,records=[],conflicts=[]}=event.detail||{};
  if(!localBranchId||!myBr().some(branch=>branch.id===localBranchId))return;
  D.labs=D.labs||[];D.lab=D.lab||[];
  let changed=false;
  for(const entry of records){
    const payload=entry.payload||{},record=payload.record||{};
    const patient=(D.patients||[]).find(item=>item.br===localBranchId&&String(item.no)===String(payload.patientNo||''));
    if(!patient)continue;
    let lab=D.labs.find(item=>String(item.name||'').trim().toLowerCase()===String(payload.labName||'').trim().toLowerCase());
    if(!lab&&payload.labName){lab={id:uid(),name:String(payload.labName),ph:''};D.labs.push(lab);changed=true}
    if(!lab)continue;
    const labNo=String(payload.labNo||'');
    let local=D.lab.find(item=>item.br===localBranchId&&String(item.no)===labNo);
    const merged={...record,id:local?.id||uid(),no:labNo,pid:patient.id,lab:lab.id,br:localBranchId,
      pays:Array.isArray(record.pays)?record.pays:[],hist:Array.isArray(record.hist)?record.hist:[],
      cloudRevision:entry.revision,cloudSnapshot:JSON.parse(JSON.stringify(payload)),cloudConflict:''};
    if(local)Object.assign(local,merged);else D.lab.push(merged);
    changed=true;
  }
  for(const conflict of conflicts){
    const local=D.lab.find(item=>item.br===localBranchId&&String(item.no)===String(conflict.labNo||''));
    if(local)local.cloudConflict=conflict.reason||'sync_conflict';
  }
  if(changed||conflicts.length){save();if(view==='lab'&&!$('#dlg')?.open&&!$('#dlg2')?.open)labV();}
  if(conflicts.length)toast('يوجد '+conflicts.length+' تعارضات في حالات المعمل؛ احتفظنا بالبيانات المحلية.');
});

window.addEventListener('dcos:cloud-inventory',event=>{
  if(!D||!ME)return;
  const {localBranchId,items=[],conflicts=[]}=event.detail||{};
  if(!localBranchId||!myBr().some(branch=>branch.id===localBranchId))return;
  D.items=D.items||[];
  for(const incoming of items){
    const local=D.items.find(item=>item.br===localBranchId&&String(item.id)===String(incoming.id));
    if(local)Object.assign(local,incoming,{id:local.id,br:localBranchId});
    else D.items.push({...incoming,br:localBranchId});
  }
  for(const conflict of conflicts){
    const local=D.items.find(item=>item.br===localBranchId&&String(item.id)===String(conflict.localId));
    if(local)local.cloudConflict=conflict.reason||'sync_conflict';
  }
  if(items.length||conflicts.length){save();if(view==='stk'&&!$('#dlg')?.open&&!$('#dlg2')?.open)stkV();}
  if(conflicts.length)toast('يوجد '+conflicts.length+' تعارضات في المخزون؛ لم يتم استبدال البيانات المتعارضة.');
});

window.addEventListener('dcos:cloud-appointments',event=>{
  if(!D||!ME)return;
  const {localBranchId,appointments=[],conflicts=[]}=event.detail||{};
  if(!localBranchId||!myBr().some(branch=>branch.id===localBranchId))return;
  D.appts=D.appts||[];
  let changed=false;
  for(const incoming of appointments){
    let local=D.appts.find(item=>item.br===localBranchId&&(
      String(item.cloudRecordKey||item.id)===String(incoming.cloudRecordKey||incoming.id)||
      (item.remoteId&&item.remoteId===incoming.remoteId)
    ));
    if(local){
      const keepId=local.id;
      Object.assign(local,incoming,{id:keepId,br:localBranchId,cloudConflict:''});
    }else{
      D.appts.push({...incoming,br:localBranchId,cloudConflict:''});
    }
    changed=true;
  }
  for(const conflict of conflicts){
    const local=D.appts.find(item=>item.br===localBranchId&&(
      String(item.cloudRecordKey||item.id)===String(conflict.localId)||
      String(item.id)===String(conflict.localId)
    ));
    if(local)local.cloudConflict=conflict.reason||'sync_conflict';
  }
  if(changed||conflicts.length){
    save();
    if(view==='apt'&&!$('#dlg')?.open&&!$('#dlg2')?.open)aptV();
  }
  if(conflicts.length)toast('يوجد '+conflicts.length+' تعارض في المواعيد؛ لم يتم استبدال البيانات المتعارضة.');
});
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
function audit(act,ref,det){D.audit.unshift({id:uid(),t:now(),u:ME?ME.name:'—',r:ME?ME.role:'',act,ref:ref||'',det:det||''});D.audit.length=Math.min(D.audit.length,2000)}
async function hp(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
